---
name: Deploy App

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

# env:
#   GCP_REGION: ${{ vars.GCP_REGION }}
#   REPOSITORY_NAME: ajustement-auto-repo
#   IMAGE_NAME: ajustement-auto

jobs:
  build_and_deploy_test:
    name: Build & Deploy to Test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/test'

    environment: Test

    env:
      PROJECT_ID: "project-e82b0d81-c629-4a85-bc1"
      GAR_LOCATION: europe-west9
      REPOSITORY_NAME: ajustement-auto-repo
      IMAGE_NAME: ajustement-auto

    permissions:
      contents: read
      id-token: write

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"

      - name: "Google auth"
        id: "auth"
        uses: "google-github-actions/auth@v1"
        with:
          workload_identity_provider: "projects/1077512308788/locations/global/workloadIdentityPools/my-pool/providers/my-provider"
          service_account: "my-service-account@project-e82b0d81-c629-4a85-bc1.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"
        with:
          project_id: "${{ env.PROJECT_ID }}"

      - name: "Docker auth"
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet
